name: CI
on:
  workflow_dispatch:
    inputs:
      branch: { required: true, type: string }
      head: { required: true, type: string }
permissions:
  contents: write
jobs:
  merge-and-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.branch }}", fetch-depth: 0 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - env:
          BRANCH: ${{ inputs.branch }}
          HEAD_SHA: ${{ inputs.head }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git merge --no-ff --no-commit origin/master || true
          bad=$(git diff --name-only --diff-filter=U | grep -v -E '^unity/com\.needle\.inference/(Analyzers|Runtime/Plugins)/.*\.dll$' || true)
          if [ -n "$bad" ]; then echo "non-DLL conflicts: $bad"; exit 1; fi
          for f in $(git diff --name-only --diff-filter=U); do git checkout --theirs -- "$f"; git add "$f"; done
          bash tools/pack-unity.sh
          bash tools/pack-unity.sh --check
          git add unity/com.needle.inference/Runtime/Plugins unity/com.needle.inference/Analyzers
          git status --short
          git commit -m "Merge master into $BRANCH and repack the Unity plugins (tools/pack-unity.sh)"
          git push origin HEAD:"$BRANCH"
