name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/fetch.sh
      - uses: actions/upload-artifact@v4
        with: { name: ref-fixtures, path: ref, retention-days: 1, compression-level: 1 }
  test:
    name: arm64 ${{ matrix.sha }}
    needs: fixtures
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        sha: [a243987, 63b5974, 9d67962, 5a680bf, f778449, ae526c6]
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: git checkout ${{ matrix.sha }} -- src tests Directory.Build.props 2>/dev/null || git checkout ${{ matrix.sha }} -- src tests
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - uses: actions/download-artifact@v4
        with: { name: ref-fixtures, path: ref }
      - run: dotnet test tests/Needle.Tests -c Release --filter "FullyQualifiedName~ChunkParityTests|FullyQualifiedName~BatchedDecodeTests" --logger "console;verbosity=normal" -- xUnit.ParallelizeTestCollections=false
