name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: bash tools/pack-unity.sh && bash tools/pack-unity.sh --check && git status --short
      - uses: actions/upload-artifact@v4
        with:
          name: unity-plugins
          path: |
            unity/com.needle.inference/Runtime/Plugins
            unity/com.needle.inference/Analyzers
