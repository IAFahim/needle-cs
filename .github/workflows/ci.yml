name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  fixtures:
    name: Model and golden fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore cached ref directory
        id: ref-cache
        uses: actions/cache@v4
        with:
          path: ref
          key: ref-v2-${{ hashFiles('tools/fetch.sh', 'tools/golden.py', 'tools/golden_confidence.py', 'tools/golden_whistle.py') }}

      - name: Set up Python
        if: steps.ref-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        if: steps.ref-cache.outputs.cache-hit != 'true'
        run: pip install numpy sentencepiece soxr

      - name: Download models, tokenizer and audio clips
        if: steps.ref-cache.outputs.cache-hit != 'true'
        run: bash tools/fetch.sh

      - name: Generate golden logits and greedy decode (40 tokens)
        if: steps.ref-cache.outputs.cache-hit != 'true'
        run: python3 tools/golden.py 40

      - name: Generate golden confidence-head fixtures
        if: steps.ref-cache.outputs.cache-hit != 'true'
        run: python3 tools/golden_confidence.py

      - name: Generate Whistle stage goldens
        if: steps.ref-cache.outputs.cache-hit != 'true'
        run: python3 tools/golden_whistle.py

      - name: Verify fixtures are present
        run: |
          test -s ref/hf/needle3.cact
          test -s ref/hf/tokenizer/tokenizer.model
          test -s ref/hf/whistle/whistle.cact
          test -s ref/audio/record.wav
          test -s ref/golden/golden.json
          test -s ref/golden/case0/logits.bin
          for clip in record hotword; do
            test -s "ref/golden/whistle/$clip/mel.f32"
            test -s "ref/golden/whistle/$clip/encoder.f32"
            test -s "ref/golden/whistle/$clip/memory.f32"
            test -s "ref/golden/whistle/$clip/logits_bos.f32"
            test -s "ref/golden/whistle/$clip/meta.json"
          done
          du -sh ref

      - name: Publish fixtures for the test matrix
        uses: actions/upload-artifact@v4
        with:
          name: ref-fixtures
          path: ref
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

  test:
    name: Test (${{ matrix.name }} / ${{ matrix.shard }})
    needs: fixtures
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.expected-fail }}
    timeout-minutes: 90
    # Per-job policy for issue #32 (never a blanket flag). The linux legs are
    # required-green: linux-x64 is the primary gate (suite + NEEDLE_SCALAR=1
    # rerun + netstandard2.1 + NativeAOT publish/smoke) and linux-arm64 covers
    # NeonTests natively plus the NEON widening fallback tier (NEEDLE_NODP=1).
    # windows-x64 and macos-arm64 keep expected-fail until a re-run proves
    # them green; their known failures are classified, not waived:
    #  - native parity skips where the upstream wheel has no usable library
    #    (wheel is manylinux x86-64 only; NativeParityTests.TryLoad returns
    #    null and each test skips with a message instead of throwing);
    #  - remaining red is engine/voice numerics under investigation in #32
    #    (whisper transcripts, confidence head, whistle stage goldens).
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            expected-fail: false
            scalar: true
            netstandard: true
            neon: false
            shard: unit
          - name: linux-x64
            os: ubuntu-latest
            expected-fail: false
            scalar: true
            netstandard: true
            neon: false
            shard: core
          - name: linux-x64
            os: ubuntu-latest
            expected-fail: false
            scalar: true
            netstandard: true
            neon: false
            shard: heavy
          - name: linux-arm64
            os: ubuntu-24.04-arm
            expected-fail: false
            scalar: false
            netstandard: false
            neon: true
            shard: unit
          - name: linux-arm64
            os: ubuntu-24.04-arm
            expected-fail: false
            scalar: false
            netstandard: false
            neon: true
            shard: core
          - name: linux-arm64
            os: ubuntu-24.04-arm
            expected-fail: false
            scalar: false
            netstandard: false
            neon: true
            shard: heavy
          - name: windows-x64
            os: windows-latest
            expected-fail: true
            scalar: false
            netstandard: false
            neon: false
            shard: unit
          - name: windows-x64
            os: windows-latest
            expected-fail: true
            scalar: false
            netstandard: false
            neon: false
            shard: core
          - name: windows-x64
            os: windows-latest
            expected-fail: true
            scalar: false
            netstandard: false
            neon: false
            shard: heavy
          - name: macos-arm64
            os: macos-14
            expected-fail: true
            scalar: false
            netstandard: false
            neon: false
            shard: unit
          - name: macos-arm64
            os: macos-14
            expected-fail: true
            scalar: false
            netstandard: false
            neon: false
            shard: core
          - name: macos-arm64
            os: macos-14
            expected-fail: true
            scalar: false
            netstandard: false
            neon: false
            shard: heavy
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Download fixtures into ref
        uses: actions/download-artifact@v4
        with:
          name: ref-fixtures
          path: ref

      - name: Select shard filter
        run: |
          case "${{ matrix.shard }}" in
            unit) echo 'FILTER=FullyQualifiedName~AttentionBatchTests|FullyQualifiedName~AttentionTileTests|FullyQualifiedName~BackendTests|FullyQualifiedName~CallRestorerTests|FullyQualifiedName~EvalDatasetTests|FullyQualifiedName~FormatTests|FullyQualifiedName~FusedKernelTests|FullyQualifiedName~GrammarTests|FullyQualifiedName~HadamardMlpTests|FullyQualifiedName~Int8DotTierTests|FullyQualifiedName~KernelTests|FullyQualifiedName~MatMulTests|FullyQualifiedName~NeonTests|FullyQualifiedName~PoolTests|FullyQualifiedName~TeamBarrierTests|FullyQualifiedName~TelemetryTests|FullyQualifiedName~TierSelectionTests|FullyQualifiedName~ToolGenTests' >> $GITHUB_ENV ;;
            core) echo 'FILTER=FullyQualifiedName~ChannelTests|FullyQualifiedName~ChunkParityTests|FullyQualifiedName~EvalTests|FullyQualifiedName~HugePagesTests|FullyQualifiedName~JumpForwardTests|FullyQualifiedName~LoadingTests|FullyQualifiedName~MaskedDecodingTests|FullyQualifiedName~NativeParityTests|FullyQualifiedName~ParityTests|FullyQualifiedName~RewindTests|FullyQualifiedName~ServiceTests|FullyQualifiedName~SessionStartupTests|FullyQualifiedName~SessionTests|FullyQualifiedName~SpanApiTests|FullyQualifiedName~SpeculativeTests|FullyQualifiedName~ToolGenSessionTests|FullyQualifiedName~TypedHostTests|FullyQualifiedName~TypedSinkTests' >> $GITHUB_ENV ;;
            heavy) echo 'FILTER=FullyQualifiedName~BatchedDecodeTests|FullyQualifiedName~BenchHarnessTests|FullyQualifiedName~SpeechTests|FullyQualifiedName~VoiceTests|FullyQualifiedName~WhistleStageTests|FullyQualifiedName~ZeroAllocationTests' >> $GITHUB_ENV ;;
          esac

      - name: Run shard tests (Release)
        run: |
          BLAME=""
          if [ "${{ matrix.shard }}" != "unit" ]; then BLAME="--blame-hang --blame-hang-timeout 1500s --blame-hang-dump-type mini"; fi
          dotnet test tests/Needle.Tests -c Release --filter "$FILTER" --logger "console;verbosity=normal" $BLAME

      - name: Upload hang dumps and blame sequence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hang-dumps-${{ matrix.name }}-${{ matrix.shard }}
          path: |
            **/TestResults/**/*.dmp
            **/TestResults/**/Sequence_*.xml
          compression-level: 1

      - name: Run shard tests on the scalar backend (NEEDLE_SCALAR=1)
        if: matrix.scalar
        env:
          NEEDLE_SCALAR: "1"
        run: dotnet test tests/Needle.Tests -c Release --no-build --filter "$FILTER"

      - name: Run NeonTests natively with verbose output
        if: matrix.neon
        run: dotnet test tests/Needle.Tests -c Release --no-build --filter "FullyQualifiedName~NeonTests" --logger "console;verbosity=normal"

      - name: Run shard tests on the NEON widening fallback tier (NEEDLE_NODP=1)
        if: matrix.neon
        env:
          NEEDLE_NODP: "1"
        run: dotnet test tests/Needle.Tests -c Release --no-build --filter "$FILTER"

      - name: Build netstandard2.1 library (Release)
        if: matrix.netstandard
        run: dotnet build src/Needle -f netstandard2.1 -c Release

      - name: Publish NativeAOT CLI
        run: dotnet publish src/Needle.Cli -c Release -o out/aot

      - name: NativeAOT smoke run (tool call for a Lagos weather query)
        run: |
          exe=out/aot/needle
          if [ "$RUNNER_OS" = "Windows" ]; then exe=out/aot/needle.exe; fi
          "$exe" run ref/hf/needle3.cact tools/tools.json "what's it like in Lagos right now?" 1 | tee smoke.txt
          grep -q "get_weather" smoke.txt
