name: Unity

# The Unity side of needle-cs: com.needle.inference's tests in the Editor (EditMode and PlayMode),
# a clean import of the package as a Git-URL install sees it, and the bench on the Editor and on
# IL2CPP and CoreCLR players, next to the native library on the same machine. Everything that
# needs Unity runs on a self-hosted runner with the labels self-hosted, Linux, X64 and unity
# (setup: unity/com.needle.inference/Documentation~/testing-and-ci.md); tools/unity-ci.sh does
# the work, so the same steps run by hand on any machine with Unity.

on:
  push:
    branches: [master, main]
    paths:
      - "unity/**"
      - "src/Needle/**"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "tools/pack-unity.sh"
      - "tools/unity-*"
      - "tools/fetch.sh"
      - "tools/ref.lock"
      - "tools/native_bench.py"
      - "tools/*tools.json"
      - ".github/workflows/unity.yml"
  pull_request:
    paths:
      - "unity/**"
      - "src/Needle/**"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "tools/pack-unity.sh"
      - "tools/unity-*"
      - "tools/fetch.sh"
      - "tools/ref.lock"
      - "tools/native_bench.py"
      - "tools/*tools.json"
      - ".github/workflows/unity.yml"
  workflow_dispatch:
    inputs:
      threads:
        description: Thread counts for the benches (comma separated)
        default: "4"
      reps:
        description: Timed repetitions per prompt
        default: "5"
      players:
        description: Build and bench the IL2CPP and CoreCLR players
        type: boolean
        default: true
      windows:
        description: Run the Windows checks on the self-hosted Windows runner instead of the Unity job
        type: boolean
        default: false
      profile:
        description: Run the Unity gap profile (tools/unity-gap.sh) instead of the Unity job
        type: boolean
        default: false
      rounds:
        description: Interleaved rounds for the gap profile
        default: "3"

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  package-check:
    name: Package layout and DLL stamps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check metas, GUIDs, test asmdefs, tracked DLLs and C# 9 syntax
        run: python3 tools/unity-package-lint.py
      - name: Check the plugin DLLs were built from the current sources
        run: bash tools/pack-unity.sh --check

  unity:
    name: Unity Editor, players and bench (self-hosted)
    needs: package-check
    # A self-hosted runner on a public repository would run a fork's code on the owner's PC, so
    # pull requests from forks stop at package-check.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !inputs.windows && !inputs.profile
    runs-on: [self-hosted, Linux, X64, unity]
    timeout-minutes: 240
    # One Unity job at a time on the PC, and never cancelled halfway, so the benches are not timed
    # while another run competes for the cores.
    concurrency:
      group: unity-self-hosted
      cancel-in-progress: false
    env:
      NEEDLE_REQUIRE_MODEL: "1"
      NEEDLE_THREADS: ${{ inputs.threads || '4' }}
      NEEDLE_REPS: ${{ inputs.reps || '5' }}
      NEEDLE_WARMUPS: "1"
      NEEDLE_SETS: all
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    # Every step after checkout runs even when an earlier one failed, so one broken step (a clip
    # that will not download, say) does not hide the results of the others; the job still fails.
    steps:
      - uses: actions/checkout@v4

      - name: Show the machine and the Unity editor in use
        run: |
          echo "NEEDLE_REF_CACHE=${NEEDLE_REF_CACHE:-$HOME/needle-ref}" >> "$GITHUB_ENV"
          uname -a
          nproc
          grep -m1 'model name' /proc/cpuinfo || true
          grep -o 'avx512[a-z0-9]*\|avx2\|avx_vnni\|fma' /proc/cpuinfo | sort -u | tr '\n' ' '; echo
          echo "UNITY_EDITOR=${UNITY_EDITOR:-<newest under ~/Unity/Hub/Editor>}"
          ls -1 "$HOME/Unity/Hub/Editor" 2>/dev/null || true

      - name: Fetch the model, Whistle and audio clips into the cache (skips verified files)
        run: |
          mkdir -p "$NEEDLE_REF_CACHE"
          ln -sfn "$NEEDLE_REF_CACHE" ref
          NEEDLE_REF_DIR="$NEEDLE_REF_CACHE" bash tools/fetch.sh

      # The native library spins its own worker threads and slows down sharply when anything else
      # uses the CPU, so it runs first, on the idle machine, and once more after the Unity runs to
      # show how much the machine drifted. The CPU load and the busiest processes are printed
      # before each bench so a skewed number can be explained.
      - name: Bench the native library on the idle machine
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          mkdir -p out/unity
          tools/unity-ci.sh load native
          python3 tools/native_bench.py ref/hf/wheel ref/hf/needle3.cact tools/tools.json \
            --sets all --reps "$NEEDLE_REPS" --warmup "$NEEDLE_WARMUPS" --json > out/unity/bench-native.json

      - name: Package checks
        if: ${{ !cancelled() }}
        run: tools/unity-ci.sh lint

      - name: Clean import of the git-tracked package
        if: ${{ !cancelled() }}
        run: tools/unity-ci.sh fresh-install

      - name: EditMode tests
        if: ${{ !cancelled() }}
        run: tools/unity-ci.sh editmode

      - name: PlayMode tests
        if: ${{ !cancelled() }}
        run: tools/unity-ci.sh playmode

      - name: Bench in the Editor (CoreCLR)
        if: ${{ !cancelled() }}
        run: |
          tools/unity-ci.sh load editor
          tools/unity-ci.sh bench-editmode

      - name: Bench an IL2CPP player
        if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.players) }}
        run: tools/unity-ci.sh player il2cpp

      - name: Bench a CoreCLR player
        if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.players) }}
        run: tools/unity-ci.sh player coreclr

      - name: Bench the native library again after the Unity runs
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          tools/unity-ci.sh load native-after
          python3 tools/native_bench.py ref/hf/wheel ref/hf/needle3.cact tools/tools.json \
            --sets all --reps "$NEEDLE_REPS" --warmup "$NEEDLE_WARMUPS" --json > out/unity/bench-native-after.json

      - name: Compare the benches
        if: ${{ !cancelled() }}
        run: |
          python3 tools/unity-bench-compare.py --native out/unity/bench-native.json \
            --gamepath out/unity/gamepath-playmode.json --load out/unity/load.txt \
            editor=out/unity/bench-editmode.json \
            il2cpp=out/unity/bench-player-il2cpp.json \
            coreclr=out/unity/bench-player-coreclr.json \
            native-after=out/unity/bench-native-after.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload logs, test results and bench JSON
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: unity-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/unity/*.xml
            out/unity/*.log
            out/unity/*.json
          if-no-files-found: warn
          retention-days: 30

  build-cli:
    name: Build the needle-cs CLI for the gap profile
    if: github.event_name == 'workflow_dispatch' && inputs.profile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # Built here so nothing is installed on the self-hosted PC. The JIT build is self-contained
      # and picks its SIMD at run time, like CoreCLR in Unity; the NativeAOT build targets x86-64-v4.
      - name: Publish a self-contained JIT CLI
        run: dotnet publish src/Needle.Cli -c Release -r linux-x64 --self-contained -p:PublishAot=false -o out/cli/jit
      - name: Publish a NativeAOT CLI
        continue-on-error: true
        run: dotnet publish src/Needle.Cli -c Release -r linux-x64 -p:IlcInstructionSet=x86-64-v4 -o out/cli/aot
      - uses: actions/upload-artifact@v4
        with:
          name: gap-cli
          path: out/cli
          retention-days: 3

  profile:
    name: Unity gap profile (self-hosted)
    needs: build-cli
    if: github.event_name == 'workflow_dispatch' && inputs.profile
    runs-on: [self-hosted, Linux, X64, unity]
    timeout-minutes: 240
    concurrency:
      group: unity-self-hosted
      cancel-in-progress: false
    env:
      NEEDLE_REQUIRE_MODEL: "1"
      NEEDLE_THREADS: "4"
      NEEDLE_REPS: "3"
      NEEDLE_WARMUPS: "1"
      NEEDLE_GAP_ROUNDS: ${{ inputs.rounds || '3' }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gap-cli
          path: out/cli
      - name: Fetch the model and the native library into the cache (skips verified files)
        run: |
          echo "NEEDLE_REF_CACHE=${NEEDLE_REF_CACHE:-$HOME/needle-ref}" >> "$GITHUB_ENV"
          chmod +x out/cli/jit/needle out/cli/aot/needle 2>/dev/null || true
          cache="${NEEDLE_REF_CACHE:-$HOME/needle-ref}"
          mkdir -p "$cache"
          ln -sfn "$cache" ref
          NEEDLE_REF_DIR="$cache" bash tools/fetch.sh
      - name: Machine, CPU topology and the kernel tier each build picks
        if: ${{ !cancelled() }}
        run: tools/unity-gap.sh machine
      - name: Threads the native library runs on its own
        if: ${{ !cancelled() }}
        run: tools/unity-gap.sh native-threads
      - name: Engine ceiling, native vs plain .NET needle-cs (interleaved)
        if: ${{ !cancelled() }}
        run: tools/unity-gap.sh engines
      - name: Per-stage profile of plain .NET needle-cs
        if: ${{ !cancelled() }}
        run: tools/unity-gap.sh stages
      - name: Unity players, native vs CoreCLR vs CoreCLR with Burst kernels vs IL2CPP (interleaved)
        if: ${{ !cancelled() }}
        run: tools/unity-gap.sh players
      - name: perf samples, if perf works on this machine
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: tools/unity-gap.sh perf
      - name: Upload the gap reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: unity-gap-${{ github.run_id }}
          path: |
            out/gap/*.json
            out/gap/*.md
            out/gap/*.log
            out/unity/*.log
          if-no-files-found: warn
          retention-days: 30

  windows:
    name: Windows checks (self-hosted)
    # Only on request: a manual run with windows ticked. Reads the machine, builds, and runs the
    # model-free tests and the CPU tier report; it installs nothing.
    if: github.event_name == 'workflow_dispatch' && inputs.windows
    runs-on: [self-hosted, Windows]
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Show the machine, the Unity editors and the tools on PATH
        continue-on-error: true
        run: |
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | Format-List
          [System.Environment]::OSVersion.VersionString
          foreach ($root in @("$env:ProgramFiles\Unity\Hub\Editor", "$env:ProgramFiles\Unity")) { if (Test-Path $root) { "Unity under ${root}:"; Get-ChildItem $root -Name } }
          foreach ($tool in @('dotnet', 'git', 'bash', 'python', 'python3', 'py')) { $c = Get-Command $tool -ErrorAction SilentlyContinue; if ($c) { "${tool}: $($c.Source)" } else { "${tool}: not found" } }
          if (Get-Command dotnet -ErrorAction SilentlyContinue) { dotnet --list-sdks }

      - name: Kernel tier this machine selects
        run: dotnet run -c Release --project src/Needle.Cli -- cpu

      - name: Model-free tests (argument limits, generator diagnostics, repair, scanner, voice activity, pool)
        run: dotnet test tests/Needle.Tests -c Release --filter "FullyQualifiedName~ArgAttributeTests|FullyQualifiedName~GeneratorDiagnosticTests|FullyQualifiedName~ArgumentRepairTests|FullyQualifiedName~TypedRepairTests|FullyQualifiedName~GroundingGateTests|FullyQualifiedName~CallScannerTests|FullyQualifiedName~VoiceActivityTests|FullyQualifiedName~PoolTests|FullyQualifiedName~TeamBarrierTests|FullyQualifiedName~KernelTests|FullyQualifiedName~Needle.Tests.Conformance." -- xUnit.ParallelizeTestCollections=false
